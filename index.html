<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najh.an Journal - Real-Time Multi-Device Sync</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #050505; color: #e2e8f0; }
        .glass-card { background: rgba(18, 18, 18, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(34, 197, 94, 0.15); }
        .terminal-glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0a0a0a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #166534; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen pb-12 flex flex-col justify-between custom-scrollbar">

    <!-- Firebase SDK Setup & Core Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyBDM-GgrBkfMmFjBH4NOZczudd2Ubw6NFQ",
          authDomain: "najhan-journal.firebaseapp.com",
          projectId: "najhan-journal",
          storageBucket: "najhan-journal.firebasestorage.app",
          messagingSenderId: "650825564074",
          appId: "1:650825564074:web:1c09b74cbfdc3bfca135d3",
          measurementId: "G-TPM076LFXN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.fbMethods = { 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signInAnonymously, 
            onAuthStateChanged, 
            signOut,
            collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy 
        };
    </script>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden">
        <div class="glass-card p-8 rounded-2xl w-full max-w-md border border-emerald-500/30 terminal-glow mx-4">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 font-bold text-xl mb-3 border border-emerald-500/20">N</div>
                <h2 class="text-xl font-bold text-white tracking-wider">Najh.an Cloud Sync</h2>
                <p class="text-xs text-zinc-400 mt-1">Sync your trading journal across infinite devices.</p>
            </div>
            <div id="authError" class="mb-4 p-3 bg-red-950/50 border border-red-500/30 text-red-400 text-xs rounded-lg hidden"></div>
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1 font-semibold">Email Address</label>
                    <input type="email" id="authEmail" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1 font-semibold">Password</label>
                    <input type="password" id="authPassword" required minlength="6" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div class="pt-2 flex flex-col gap-2">
                    <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-xl transition text-sm shadow-lg shadow-emerald-900/20">Login / Sign In</button>
                    <button type="button" id="signupBtn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-emerald-400 font-semibold py-3 rounded-xl transition text-sm border border-emerald-500/20">Create New Account</button>
                </div>
            </form>
            <div class="mt-6 text-center border-t border-zinc-800/80 pt-4">
                <button id="guestBtn" class="text-xs text-zinc-400 hover:text-emerald-400 underline transition">Continue as Guest (Anonymous)</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow hidden">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 glass-card p-4 rounded-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 font-bold border border-emerald-500/20">N</div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Najh.an Journal</h1>
                    <div class="flex items-center gap-2 text-xs text-emerald-400">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="userStatusText">Cloud Connected</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="logoutBtn" class="bg-zinc-900 hover:bg-red-950/30 text-zinc-400 hover:text-red-400 border border-zinc-800 hover:border-red-500/30 text-xs px-4 py-2 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-power-off"></i> Logout
                </button>
            </div>
        </header>

        <!-- Metric Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="glass-card p-5 rounded-2xl border-l-4 border-l-emerald-500">
                <p class="text-xs text-zinc-400 uppercase font-semibold">Total PnL</p>
                <h3 id="totalPnl" class="text-2xl font-bold text-white mt-1">$0.00</h3>
            </div>
            <div class="glass-card p-5 rounded-2xl border-l-4 border-l-blue-500">
                <p class="text-xs text-zinc-400 uppercase font-semibold">Win Rate</p>
                <h3 id="winRate" class="text-2xl font-bold text-white mt-1">0%</h3>
            </div>
            <div class="glass-card p-5 rounded-2xl border-l-4 border-l-purple-500">
                <p class="text-xs text-zinc-400 uppercase font-semibold">Total Trades</p>
                <h3 id="totalTrades" class="text-2xl font-bold text-white mt-1">0</h3>
            </div>
            <div class="glass-card p-5 rounded-2xl border-l-4 border-l-amber-500">
                <p class="text-xs text-zinc-400 uppercase font-semibold">Profit Factor</p>
                <h3 id="profitFactor" class="text-2xl font-bold text-white mt-1">0.00</h3>
            </div>
        </div>

        <!-- Content Grid: Form & Trade List -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Add Trade Form -->
            <div class="glass-card p-6 rounded-2xl h-fit">
                <h2 class="text-sm font-bold text-white mb-4 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-emerald-500"></i> New Trade Entry
                </h2>
                <form id="tradeForm" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1 font-semibold">Symbol</label>
                            <input type="text" id="symbol" required placeholder="XAUUSD" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 uppercase">
                        </div>
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1 font-semibold">Type</label>
                            <select id="type" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                                <option value="BUY">BUY / LONG</option>
                                <option value="SELL">SELL / SHORT</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1 font-semibold">PnL ($)</label>
                            <input type="number" step="any" id="pnl" required placeholder="150.00" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1 font-semibold">Date</label>
                            <input type="date" id="tradeDate" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1 font-semibold">Notes / Strategy</label>
                        <textarea id="notes" rows="2" placeholder="Breakout strategy..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-xl transition text-sm shadow-lg shadow-emerald-900/20">Save Trade</button>
                </form>
            </div>

            <!-- Trade History Table -->
            <div class="glass-card p-6 rounded-2xl lg:col-span-2 flex flex-col justify-between">
                <div>
                    <h2 class="text-sm font-bold text-white mb-4 uppercase tracking-wider flex items-center justify-between">
                        <span><i class="fa-solid fa-history text-emerald-500 mr-2"></i> Trade History</span>
                        <span id="tradeCountBadge" class="text-xs bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-lg text-zinc-400">0 Trades</span>
                    </h2>
                    <div class="overflow-x-auto custom-scrollbar max-h-[380px]">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-zinc-900/80 text-zinc-400 text-xs uppercase sticky top-0">
                                <tr>
                                    <th class="p-3 rounded-l-xl">Date</th>
                                    <th class="p-3">Symbol</th>
                                    <th class="p-3">Type</th>
                                    <th class="p-3">PnL</th>
                                    <th class="p-3">Notes</th>
                                    <th class="p-3 rounded-r-xl text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="tradeTableBody" class="divide-y divide-zinc-900/50">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Logic Script -->
    <script type="module">
        let trades = [];
        let unsubscribeTrades = null;
        let currentUser = null;

        // Wait for Firebase to load
        window.addEventListener('DOMContentLoaded', () => {
            const { onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInAnonymously, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } = window.fbMethods;
            const auth = window.firebaseAuth;
            const db = window.firebaseDb;

            // Set default date to today
            document.getElementById('tradeDate').value = new Date().toISOString().split('T')[0];

            // Auth State Listener
            onAuthStateChanged(auth, (user) => {
                const authModal = document.getElementById('authModal');
                const appContainer = document.getElementById('appContainer');

                if (user) {
                    currentUser = user;
                    authModal.classList.add('hidden');
                    appContainer.classList.remove('hidden');
                    document.getElementById('userStatusText').innerText = `Synced (${user.isAnonymous ? 'Guest' : user.email})`;
                    loadUserTrades(user.uid);
                } else {
                    currentUser = null;
                    if (unsubscribeTrades) unsubscribeTrades();
                    appContainer.classList.add('hidden');
                    authModal.classList.remove('hidden');
                }
            });

            // Auth Actions
            const showError = (msg) => {
                const errDiv = document.getElementById('authError');
                errDiv.innerText = msg;
                errDiv.classList.remove('hidden');
            };

            document.getElementById('authForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('authEmail').value;
                const password = document.getElementById('authPassword').value;
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (err) { showError(err.message); }
            });

            document.getElementById('signupBtn').addEventListener('click', async () => {
                const email = document.getElementById('authEmail').value;
                const password = document.getElementById('authPassword').value;
                if(!email || !password) { showError("Please fill email and password."); return; }
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                } catch (err) { showError(err.message); }
            });

            document.getElementById('guestBtn').addEventListener('click', async () => {
                try {
                    await signInAnonymously(auth);
                } catch (err) { showError(err.message); }
            });

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await signOut(auth);
            });

            // Load Trades from Firestore
            function loadUserTrades(uid) {
                const q = query(collection(db, "artifacts", "najhan-journal-app", "users", uid, "trades"), orderBy("date", "desc"));
                unsubscribeTrades = onSnapshot(q, (snapshot) => {
                    trades = [];
                    snapshot.forEach((docSnap) => {
                        trades.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    renderUI();
                });
            }

            // Add Trade Form Submission
            document.getElementById('tradeForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentUser) return;

                const newTrade = {
                    symbol: document.getElementById('symbol').value.toUpperCase(),
                    type: document.getElementById('type').value,
                    pnl: parseFloat(document.getElementById('pnl').value),
                    date: document.getElementById('tradeDate').value,
                    notes: document.getElementById('notes').value,
                    createdAt: Date.now()
                };

                try {
                    await addDoc(collection(db, "artifacts", "najhan-journal-app", "users", currentUser.uid, "trades"), newTrade);
                    document.getElementById('tradeForm').reset();
                    document.getElementById('tradeDate').value = new Date().toISOString().split('T')[0];
                } catch (err) {
                    alert("Error saving trade: " + err.message);
                }
            });

            // Delete Trade
            window.deleteTrade = async function(id) {
                if (!currentUser) return;
                if (confirm("Are you sure you want to delete this trade?")) {
                    try {
                        await deleteDoc(doc(db, "artifacts", "najhan-journal-app", "users", currentUser.uid, "trades", id));
                    } catch (err) {
                        alert("Error deleting trade: " + err.message);
                    }
                }
            };

            // Render Metrics & Table
            function renderUI() {
                const tbody = document.getElementById('tradeTableBody');
                tbody.innerHTML = '';

                let totalPnl = 0;
                let wins = 0;
                let totalProfit = 0;
                let totalLoss = 0;

                trades.forEach(t => {
                    totalPnl += t.pnl;
                    if (t.pnl > 0) {
                        wins++;
                        totalProfit += t.pnl;
                    } else {
                        totalLoss += Math.abs(t.pnl);
                    }

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-zinc-900/40 transition border-b border-zinc-900/50";
                    tr.innerHTML = `
                        <td class="p-3 text-zinc-300 text-xs">${t.date}</td>
                        <td class="p-3 font-bold text-white">${t.symbol}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${t.type === 'BUY' ? 'bg-emerald-950 text-emerald-400 border border-emerald-500/30' : 'bg-red-950 text-red-400 border border-red-500/30'}">${t.type}</span></td>
                        <td class="p-3 font-semibold ${t.pnl >= 0 ? 'text-emerald-400' : 'text-red-400'}">${t.pnl >= 0 ? '+' : ''}$${t.pnl.toFixed(2)}</td>
                        <td class="p-3 text-zinc-400 text-xs truncate max-w-xs">${t.notes || '-'}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteTrade('${t.id}')" class="text-zinc-500 hover:text-red-400 transition p-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // Update Metrics Display
                document.getElementById('totalPnl').innerText = `${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(2)}`;
                document.getElementById('totalPnl').className = `text-2xl font-bold mt-1 ${totalPnl >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
                
                const winRate = trades.length > 0 ? ((wins / trades.length) * 100).toFixed(1) : 0;
                document.getElementById('winRate').innerText = `${winRate}%`;
                document.getElementById('totalTrades').innerText = trades.length;
                document.getElementById('tradeCountBadge').innerText = `${trades.length} Trades`;

                const profitFactor = totalLoss === 0 ? (totalProfit > 0 ? totalProfit.toFixed(2) : '0.00') : (totalProfit / totalLoss).toFixed(2);
                document.getElementById('profitFactor').innerText = profitFactor;
            }
        });
    </script>
</body>
</html>
