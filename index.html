<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAJHAN - Institutional Trading Terminal v2.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#020407',
                        cardBg: '#020407',
                        cardBorder: 'rgba(16, 185, 129, 0.2)',
                        brandGreen: '#10B981',
                        brandGreenGlow: '#22C55E',
                        brandRed: '#EF4444',
                        accentDark: '#020407'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'Monaco', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Chart.js & html2canvas CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Font: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: #020407;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-card {
            background: #020407;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(16, 185, 129, 0.2); 
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15), 0 25px 60px 0 rgba(0, 0, 0, 0.85);
            transition: all 0.3s ease;
        }

        @keyframes permanentGlow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(16, 185, 129, 0.12), 0 25px 60px 0 rgba(0, 0, 0, 0.85);
            }
            50% {
                box-shadow: 0 0 28px rgba(16, 185, 129, 0.28), 0 25px 60px 0 rgba(0, 0, 0, 0.85);
            }
        }
        .glass-card {
            animation: permanentGlow 4s ease-in-out infinite;
        }

        /* Recap Card Custom Styles (100% Match Video) */
        .recap-story-dark {
            background: radial-gradient(120% 75% at 50% 0%, #10321d 0%, #09130d 45%, #060907 100%);
            color: #ffffff;
            border: 1px solid rgba(34, 197, 94, 0.18);
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.9), 0 0 40px rgba(16, 185, 129, 0.12);
        }

        .recap-story-light {
            background: radial-gradient(120% 75% at 50% 0%, #dcfce7 0%, #f0fdf4 45%, #ffffff 100%);
            color: #090d0b;
            border: 1px solid rgba(16, 185, 129, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .recap-subcard-dark {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .recap-subcard-light {
            background: rgba(16, 185, 129, 0.06);
            border: 1px solid rgba(16, 185, 129, 0.15);
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Smooth Bar & Trajectory Animations */
        .recap-bar-fill {
            transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: width;
        }

        @keyframes recapRowSlideIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .recap-row-enter {
            animation: recapRowSlideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        @keyframes recapAreaFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .recap-traj-area-anim {
            animation: recapAreaFade 0.65s ease-out forwards;
        }

        @keyframes recapDotPop {
            0% { opacity: 0; transform: scale(0); }
            75% { opacity: 1; transform: scale(1.25); }
            100% { opacity: 1; transform: scale(1); }
        }
        .recap-traj-dot-anim {
            transform-box: fill-box;
            transform-origin: center;
            animation: recapDotPop 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.45s backwards;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #020407;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10B981;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
        }
        @media (min-width: 640px) {
            .calendar-grid {
                gap: 8px;
            }
        }

        .calendar-day {
            min-height: 84px;
            height: auto;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (min-width: 640px) {
            .calendar-day {
                min-height: 100px;
            }
        }

        .yearly-months-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }
        @media (min-width: 640px) {
            .yearly-months-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 14px;
            }
        }

        .btn-tag {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-tag.active {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: #000000;
            font-weight: 700;
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.55);
            border-color: transparent;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #networkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: auto;
            z-index: 1;
        }
    </style>
</head>
